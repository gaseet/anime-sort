<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime Sort Search</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --accent:#7c9cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1 { font-size:16px; margin:0 0 10px; font-weight:600; }
  form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  input[type=search] { flex:1 1 220px; }
  input[type=number] { width:90px; }
  button { cursor:pointer; background:var(--accent); color:#0b0d12; border:none; font-weight:600; }
  button.ghost { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  label.chk { display:flex; gap:6px; align-items:center; color:var(--muted); }
  #status { color:var(--muted); padding:10px 16px 0; min-height:24px; }
  main { padding:12px 16px 40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; text-decoration:none; color:inherit; transition:transform .12s, border-color .12s; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .cover { aspect-ratio:2/3; width:100%; object-fit:cover; background:#222; display:block; }
  .body { padding:8px 10px 10px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .end { font-size:12px; font-weight:700; color:var(--accent); }
  a.main { color:inherit; text-decoration:none; }
  .title { font-size:13px; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .meta { font-size:12px; color:var(--muted); }
  .links { display:flex; gap:10px; margin-top:auto; padding-top:4px; font-size:12px; }
  .links a { color:var(--muted); }
  .links a:hover { color:var(--text); }
  #more { display:block; margin:0 auto 40px; }
  @media (max-width:520px){ main { grid-template-columns:repeat(2, 1fr); gap:10px; } }
</style>
</head>
<body>
<header>
  <h1>Anime search, every AniList sort</h1>
  <form id="f">
    <input type="search" id="q" placeholder="Search title (optional)">
    <select id="sortField" aria-label="Sort by">
      <option value="END_DATE" selected>End date</option>
      <option value="START_DATE">Start date</option>
      <option value="POPULARITY">Popularity</option>
      <option value="SCORE">Average score</option>
      <option value="TRENDING">Trending</option>
      <option value="FAVOURITES">Favourites</option>
      <option value="TITLE_ROMAJI">Title (romaji)</option>
      <option value="TITLE_ENGLISH">Title (English)</option>
      <option value="TITLE_NATIVE">Title (native)</option>
      <option value="EPISODES">Episodes</option>
      <option value="DURATION">Episode length</option>
      <option value="FORMAT">Format</option>
      <option value="STATUS">Status</option>
      <option value="ID">Date added to AniList</option>
      <option value="UPDATED_AT">Last updated on AniList</option>
      <option value="SEARCH_MATCH">Search relevance</option>
    </select>
    <select id="sortDir" aria-label="Direction">
      <option value="DESC" selected>Descending</option>
      <option value="ASC">Ascending</option>
    </select>
    <select id="format">
      <option value="">Any format</option>
      <option value="TV">TV</option>
      <option value="TV_SHORT">TV Short</option>
      <option value="MOVIE">Movie</option>
      <option value="OVA">OVA</option>
      <option value="ONA">ONA</option>
      <option value="SPECIAL">Special</option>
    </select>
    <select id="genre"><option value="">Any genre</option></select>
    <input type="number" id="fromYear" placeholder="Ended from" min="1940" max="2100">
    <input type="number" id="toYear" placeholder="Ended until" min="1940" max="2100">
    <label class="chk"><input type="checkbox" id="finished" checked> Finished only</label>
    <button type="submit">Search</button>
  </form>
</header>
<div id="status"></div>
<main id="grid"></main>
<button id="more" class="ghost" hidden>Load more</button>

<script>
const API = "https://graphql.anilist.co";
const GENRES = ["Action","Adventure","Comedy","Drama","Ecchi","Fantasy","Horror","Mahou Shoujo","Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life","Sports","Supernatural","Thriller"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const $ = id => document.getElementById(id);
GENRES.forEach(g => $("genre").insertAdjacentHTML("beforeend", `<option>${g}</option>`));

const QUERY = `
query ($page:Int, $sort:[MediaSort], $search:String, $format:MediaFormat, $genre:String,
       $status:MediaStatus, $endAfter:FuzzyDateInt, $endBefore:FuzzyDateInt) {
  Page(page:$page, perPage:30) {
    pageInfo { hasNextPage }
    media(type:ANIME, isAdult:false, sort:$sort, search:$search, format:$format, genre:$genre,
          status:$status, endDate_greater:$endAfter, endDate_lesser:$endBefore) {
      id siteUrl format status episodes duration averageScore popularity trending favourites updatedAt
      title { romaji english }
      coverImage { large }
      startDate { year month day }
      endDate { year month day }
    }
  }
}`;

let page = 1, vars = {}, loading = false;

function today() {
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function fmtDate(d) {
  if (!d || !d.year) return "No end date";
  return [d.day, d.month ? MONTHS[d.month-1] : null, d.year].filter(Boolean).join(" ");
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function sortKey() {
  const f = $("sortField").value;
  if (f === "SEARCH_MATCH") return f;             // AniList has no SEARCH_MATCH_DESC
  return $("sortDir").value === "DESC" ? f + "_DESC" : f;
}
function buildVars() {
  const v = { sort: [sortKey(), "ID_DESC"] };     // ID as stable tie-breaker
  const q = $("q").value.trim(); if (q) v.search = q;
  if ($("format").value) v.format = $("format").value;
  if ($("genre").value) v.genre = $("genre").value;
  if ($("finished").checked) v.status = "FINISHED";
  const from = parseInt($("fromYear").value), to = parseInt($("toYear").value);
  if (from) v.endAfter = (from-1)*10000 + 1231;        // after Dec 31 of previous year
  // cap at today so placeholder future end dates don't float to the top.
  // Only when it can't hide airing shows the user asked for.
  if (to) v.endBefore = Math.min((to+1)*10000 + 101, today()+1);
  else if ($("finished").checked) v.endBefore = today()+1;
  return v;
}

function highlight(m) {
  const f = $("sortField").value, n = x => x == null ? "n/a" : x.toLocaleString();
  switch (f) {
    case "START_DATE": return "Started " + fmtDate(m.startDate).replace("No end date", "TBA");
    case "POPULARITY": return n(m.popularity) + " users";
    case "SCORE": return m.averageScore ? m.averageScore + "% score" : "No score";
    case "TRENDING": return "Trending " + n(m.trending);
    case "FAVOURITES": return n(m.favourites) + " favourites";
    case "EPISODES": return m.episodes ? m.episodes + " episodes" : "Episodes n/a";
    case "DURATION": return m.duration ? m.duration + " min/ep" : "Length n/a";
    case "STATUS": return (m.status || "").replace(/_/g, " ").toLowerCase();
    case "UPDATED_AT": return "Updated " + (m.updatedAt ? new Date(m.updatedAt*1000).toLocaleDateString() : "n/a");
    case "ID": return "AniList #" + m.id;
    default: return m.endDate && m.endDate.year ? "Ended " + fmtDate(m.endDate) : (m.status === "RELEASING" ? "Airing" : "No end date");
  }
}
function card(m) {
  const title = m.title.english || m.title.romaji;
  const alt = m.title.english && m.title.romaji !== m.title.english ? m.title.romaji : "";
  const meta = [m.format?.replace("_"," "), m.episodes ? m.episodes + " ep" : null, m.averageScore ? m.averageScore + "%" : null].filter(Boolean).join(" · ");
  return `
  <div class="card" title="${esc(alt || title)}">
    <a class="main" href="https://www.miruro.tv/watch?id=${m.id}" target="_blank" rel="noopener">
      <img class="cover" loading="lazy" src="${esc(m.coverImage.large)}" alt="">
    </a>
    <div class="body">
      <div class="end">${esc(highlight(m))}</div>
      <a class="main title" href="https://www.miruro.tv/watch?id=${m.id}" target="_blank" rel="noopener">${esc(title)}</a>
      <div class="meta">${esc(meta)}</div>
      <div class="links">
        <a href="${esc(m.siteUrl)}" target="_blank" rel="noopener">AniList</a>
        <a href="https://www.miruro.tv/search?query=${encodeURIComponent(m.title.romaji)}" target="_blank" rel="noopener">Search on Miruro</a>
      </div>
    </div>
  </div>`;
}

async function load(reset) {
  if (loading) return;
  loading = true;
  if (reset) { page = 1; vars = buildVars(); $("grid").innerHTML = ""; }
  $("status").textContent = "Loading…";
  $("more").hidden = true;
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query: QUERY, variables: { ...vars, page } })
    });
    const j = await r.json();
    if (j.errors) throw new Error(j.errors.map(e => e.message).join("; "));
    const { media, pageInfo } = j.data.Page;
    $("grid").insertAdjacentHTML("beforeend", media.map(card).join(""));
    const n = $("grid").children.length;
    $("status").textContent = n ? `${n} titles shown` : "No results.";
    $("more").hidden = !pageInfo.hasNextPage;
    page++;
  } catch (e) {
    $("status").textContent = "Error: " + e.message + (String(e.message).includes("Too Many") ? " (AniList rate limit, wait a minute)" : "");
  } finally { loading = false; }
}

$("sortField").addEventListener("change", () => { $("sortDir").disabled = $("sortField").value === "SEARCH_MATCH"; });
$("f").addEventListener("submit", e => { e.preventDefault(); load(true); });
$("more").addEventListener("click", () => load(false));
load(true);
</script>
</body>
</html>
